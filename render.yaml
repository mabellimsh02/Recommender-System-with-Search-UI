services:
  - type: web
    name: recommender-backend
    runtime: python
    plan: free
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.7
      - key: MOVIES_DATA_DIR
        value: data/processed
      - key: TMDB_API_KEY
        sync: false
      - key: CORS_ORIGINS
        sync: false
